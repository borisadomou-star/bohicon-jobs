<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bohicon Jobs</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#1a1a1a}
  header{background:#0a7d3b;color:#fff;padding:20px 16px;text-align:center}
  header h1{margin:0;font-size:1.5rem}
  header p{margin:4px 0 0;opacity:.9;font-size:.9rem}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  h2{font-size:1.1rem;margin:0 0 10px}
  input,select,textarea,button{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem;font-family:inherit}
  button{background:#0a7d3b;color:#fff;border:0;font-weight:600;cursor:pointer}
  button.sec{background:#fff;color:#0a7d3b;border:1px solid #0a7d3b}
  button.danger{background:#fff;color:#b3261e;border:1px solid #b3261e;margin-top:8px;margin-bottom:0;padding:8px}
  button:disabled{opacity:.6}
  .lien{background:none;border:0;color:#0a7d3b;text-decoration:underline;font-weight:400;padding:4px;margin:0}
  .check{display:flex;align-items:flex-start;gap:8px;font-size:.85rem;margin-bottom:12px;color:#444}
  .check input{width:auto;margin:3px 0 0}
  .job h3{margin:0 0 4px;font-size:1.05rem}
  .meta{font-size:.85rem;color:#555;margin-bottom:6px}
  .prix{color:#0a7d3b;font-weight:700}
  .wa{display:block;text-align:center;background:#25d366;color:#fff;padding:10px;border-radius:8px;text-decoration:none;font-weight:600;margin-top:8px}
  .verrou{display:block;text-align:center;background:#eee;color:#555;padding:10px;border-radius:8px;margin-top:8px;font-size:.9rem}
  .vide{text-align:center;color:#777;padding:20px}
  .erreur{background:#fdecea;color:#b3261e;padding:12px;border-radius:8px;margin-bottom:12px}
  .info{background:#e8f5e9;color:#0a5d2c;padding:12px;border-radius:8px;margin-bottom:12px}
  .cache{display:none}
  .moi{font-size:.9rem;margin-bottom:10px;word-break:break-word}
</style>
</head>
<body>
<header>
  <h1>Bohicon Jobs</h1>
  <p>Trouve une mission rémunérée ou publie la tienne</p>
</header>

<main>
  <div id="message"></div>

  <!-- Connexion -->
  <div class="card" id="bloc-connexion">
    <h2>Connexion</h2>
    <input id="email" type="email" placeholder="Ton e-mail" autocomplete="email">
    <input id="mdp" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="btn-connexion">Se connecter</button>
    <button id="btn-vers-inscription" class="sec">Créer un compte</button>
    <button id="btn-reset" class="lien" type="button">Mot de passe oublié ?</button>
  </div>

  <!-- Inscription -->
  <div class="card cache" id="bloc-inscription">
    <h2>Créer un compte</h2>
    <div id="champs-inscription"></div>
    <input id="i-email" type="email" placeholder="Ton e-mail" autocomplete="email">
    <input id="i-mdp" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="new-password">
    <button id="btn-inscription">S'inscrire</button>
    <button id="btn-vers-connexion" class="lien" type="button">J'ai déjà un compte</button>
  </div>

  <!-- Profil à compléter (compte existant sans profil) -->
  <div class="card cache" id="bloc-profil">
    <h2>Complète ton profil</h2>
    <div id="champs-profil"></div>
    <button id="btn-profil">Enregistrer</button>
    <button id="btn-deco-profil" class="sec" style="margin-bottom:0">Se déconnecter</button>
  </div>

  <!-- Compte connecté -->
  <div class="card cache" id="bloc-compte">
    <div class="moi" id="moi"></div>
    <button id="btn-deconnexion" class="sec" style="margin-bottom:0">Se déconnecter</button>
  </div>

  <!-- Publication -->
  <div class="card cache" id="bloc-publier">
    <h2>Publier une mission</h2>
    <input id="titre" placeholder="Titre (ex : Laver ma moto)" maxlength="60">
    <select id="ville">
      <option>Bohicon</option><option>Abomey</option><option>Covè</option>
      <option>Zogbodomey</option><option>Djidja</option><option>Autre</option>
    </select>
    <input id="prix" type="number" placeholder="Prix proposé (FCFA)" min="0">
    <textarea id="desc" rows="3" placeholder="Description de la mission" maxlength="300"></textarea>
    <button id="publier">Publier</button>
  </div>

  <div class="card">
    <h2>Missions disponibles</h2>
    <select id="filtre" style="margin-bottom:0">
      <option value="">Toutes les villes</option>
      <option>Bohicon</option><option>Abomey</option><option>Covè</option>
      <option>Zogbodomey</option><option>Djidja</option><option>Autre</option>
    </select>
  </div>

  <div id="liste"><div class="vide">Chargement…</div></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, getDoc, setDoc, query, orderBy, limit, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword,
           signOut, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB6Wm1E1-tNSxVNJcyitA4N_3PLdZUgr7k",
    authDomain: "bohicon-jobs.firebaseapp.com",
    projectId: "bohicon-jobs",
    storageBucket: "bohicon-jobs.firebasestorage.app",
    messagingSenderId: "505683521455",
    appId: "1:505683521455:web:d9bcf7a1b1143eeaf9895a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const missionsRef = collection(db, "missions");

  let missions = [];
  let user = null;
  let profil = null;
  let enInscription = false;
  let vueInscription = false;
  const $ = id => document.getElementById(id);

  // Champs du profil, injectés dans l'inscription et dans « compléter le profil »
  const champs = p => `
    <input id="${p}prenom" placeholder="Prénom" maxlength="40" autocomplete="given-name">
    <input id="${p}nom" placeholder="Nom" maxlength="40" autocomplete="family-name">
    <input id="${p}tel" type="tel" placeholder="Numéro WhatsApp (ex : 0155000000)" autocomplete="tel">
    <select id="${p}ville">
      <option value="">Ville de résidence…</option>
      <option>Bohicon</option><option>Abomey</option><option>Covè</option>
      <option>Zogbodomey</option><option>Djidja</option><option>Autre</option>
    </select>
    <input id="${p}adresse" placeholder="Quartier / adresse de résidence" maxlength="100" autocomplete="street-address">
    <select id="${p}role">
      <option value="les deux">Je veux trouver ET publier des missions</option>
      <option value="travailleur">Je cherche des missions à faire</option>
      <option value="client">Je veux publier des missions</option>
    </select>
    <label class="check"><input type="checkbox" id="${p}ok">
      <span>J'ai 18 ans ou plus et j'accepte que mes informations servent au fonctionnement de la plateforme.</span></label>`;
  $("champs-inscription").innerHTML = champs("i-");
  $("champs-profil").innerHTML = champs("p-");

  // Lit et valide les champs du profil ; renvoie null si invalide
  function lireProfil(p){
    const prenom = $(p + "prenom").value.trim();
    const nom = $(p + "nom").value.trim();
    const tel = $(p + "tel").value.trim();
    const ville = $(p + "ville").value;
    const adresse = $(p + "adresse").value.trim();
    const role = $(p + "role").value;
    if (prenom.length < 2 || nom.length < 2){ afficherMessage("Entre ton prénom et ton nom."); return null; }
    if (tel.replace(/\D/g, "").length < 8){ afficherMessage("Numéro WhatsApp invalide."); return null; }
    if (!ville){ afficherMessage("Choisis ta ville de résidence."); return null; }
    if (adresse.length < 3){ afficherMessage("Entre ton quartier ou adresse de résidence."); return null; }
    if (!$(p + "ok").checked){ afficherMessage("Tu dois confirmer avoir 18 ans ou plus et accepter l'utilisation de tes informations."); return null; }
    return { prenom, nom, tel, ville, adresse, role };
  }

  function afficherMessage(texte, type){
    const z = $("message");
    z.innerHTML = "";
    if (!texte) return;
    const e = document.createElement("div");
    e.className = type === "info" ? "info" : "erreur";
    e.textContent = texte;
    z.appendChild(e);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function texteErreurAuth(e){
    switch (e.code){
      case "auth/invalid-email": return "Adresse e-mail invalide.";
      case "auth/missing-password": return "Entre ton mot de passe.";
      case "auth/weak-password": return "Mot de passe trop court (6 caractères minimum).";
      case "auth/email-already-in-use": return "Cet e-mail a déjà un compte. Clique sur « J'ai déjà un compte ».";
      case "auth/invalid-credential":
      case "auth/wrong-password":
      case "auth/user-not-found": return "E-mail ou mot de passe incorrect.";
      case "auth/too-many-requests": return "Trop de tentatives. Réessaie dans quelques minutes.";
      case "auth/network-request-failed": return "Problème de connexion internet.";
      default: return "Une erreur est survenue. Réessaie.";
    }
  }

  function lienWhatsApp(tel, titre){
    let n = String(tel).replace(/\D/g, "");
    if (!n.startsWith("229")) n = "229" + n;
    const msg = encodeURIComponent("Bonjour, je suis intéressé par la mission : " + titre);
    return "https://wa.me/" + n + "?text=" + msg;
  }

  function majUI(){
    const connecte = !!user;
    const aProfil = !!profil;
    $("bloc-connexion").classList.toggle("cache", connecte || vueInscription);
    $("bloc-inscription").classList.toggle("cache", connecte || !vueInscription);
    $("bloc-profil").classList.toggle("cache", !(connecte && !aProfil && !enInscription));
    $("bloc-compte").classList.toggle("cache", !(connecte && aProfil));
    $("bloc-publier").classList.toggle("cache", !(connecte && aProfil));
    $("moi").textContent = (connecte && aProfil)
      ? "Connecté : " + profil.prenom + " " + profil.nom + " (" + user.email + ")" : "";
    afficher();
  }

  function afficher(){
    const f = $("filtre").value;
    const liste = $("liste");
    liste.innerHTML = "";
    const items = missions.filter(m => !f || m.ville === f);
    if (items.length === 0){
      liste.innerHTML = '<div class="vide">Aucune mission pour le moment.</div>';
      return;
    }
    items.forEach(m => {
      const c = document.createElement("div");
      c.className = "card job";
      const h = document.createElement("h3"); h.textContent = m.titre;
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = "📍 " + m.ville + " · ";
      const p = document.createElement("span"); p.className = "prix";
      p.textContent = Number(m.prix).toLocaleString("fr-FR") + " FCFA";
      meta.appendChild(p);
      if (m.auteur) meta.appendChild(document.createTextNode(" · par " + m.auteur));
      const d = document.createElement("div"); d.textContent = m.desc || "";
      c.append(h, meta, d);

      if (user){
        const a = document.createElement("a");
        a.className = "wa"; a.textContent = "Contacter sur WhatsApp";
        a.href = lienWhatsApp(m.tel, m.titre); a.target = "_blank"; a.rel = "noopener";
        c.appendChild(a);
      } else {
        const v = document.createElement("div");
        v.className = "verrou";
        v.textContent = "🔒 Connecte-toi pour contacter";
        c.appendChild(v);
      }

      if (user && m.uid === user.uid){
        const b = document.createElement("button");
        b.className = "danger";
        b.textContent = "Supprimer ma mission";
        b.addEventListener("click", async () => {
          if (!confirm("Supprimer cette mission ?")) return;
          try { await deleteDoc(doc(db, "missions", m.id)); }
          catch (e) { console.error(e); afficherMessage("Suppression impossible. Réessaie."); }
        });
        c.appendChild(b);
      }
      liste.appendChild(c);
    });
  }

  // Missions en temps réel
  const q = query(missionsRef, orderBy("createdAt", "desc"), limit(100));
  onSnapshot(q, snap => {
    missions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    afficher();
  }, err => {
    console.error(err);
    afficherMessage("Impossible de charger les missions. Vérifie ta connexion et réessaie.");
    $("liste").innerHTML = "";
  });

  // État de connexion + chargement du profil
  onAuthStateChanged(auth, async u => {
    user = u;
    profil = null;
    if (u && !enInscription){
      try {
        const s = await getDoc(doc(db, "users", u.uid));
        profil = s.exists() ? s.data() : null;
      } catch (e) { console.error(e); }
    }
    majUI();
  });

  $("btn-vers-inscription").addEventListener("click", () => { afficherMessage(""); vueInscription = true; majUI(); });
  $("btn-vers-connexion").addEventListener("click", () => { afficherMessage(""); vueInscription = false; majUI(); });

  $("btn-connexion").addEventListener("click", async () => {
    afficherMessage("");
    try {
      await signInWithEmailAndPassword(auth, $("email").value.trim(), $("mdp").value);
      $("mdp").value = "";
    } catch (e) { console.error(e); afficherMessage(texteErreurAuth(e)); }
  });

  $("btn-inscription").addEventListener("click", async () => {
    afficherMessage("");
    const data = lireProfil("i-");
    if (!data) return;
    const btn = $("btn-inscription");
    btn.disabled = true; btn.textContent = "Création du compte…";
    enInscription = true;
    try {
      const cred = await createUserWithEmailAndPassword(auth, $("i-email").value.trim(), $("i-mdp").value);
      await setDoc(doc(db, "users", cred.user.uid), { ...data, email: cred.user.email, createdAt: serverTimestamp() });
      profil = data;
      $("i-mdp").value = "";
    } catch (e) {
      console.error(e);
      afficherMessage(e.code ? texteErreurAuth(e) : "Compte créé, mais le profil n'a pas pu être enregistré. Complète-le ci-dessous.");
    }
    enInscription = false;
    user = auth.currentUser;
    btn.disabled = false; btn.textContent = "S'inscrire";
    majUI();
  });

  $("btn-profil").addEventListener("click", async () => {
    afficherMessage("");
    const data = lireProfil("p-");
    if (!data || !user) return;
    try {
      await setDoc(doc(db, "users", user.uid), { ...data, email: user.email, createdAt: serverTimestamp() }, { merge: true });
      profil = data;
      majUI();
    } catch (e) { console.error(e); afficherMessage("Le profil n'a pas pu être enregistré. Réessaie."); }
  });

  $("btn-reset").addEventListener("click", async () => {
    const email = $("email").value.trim();
    if (!email){ afficherMessage("Entre ton e-mail ci-dessus, puis reclique sur « Mot de passe oublié ? »."); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      afficherMessage("E-mail envoyé. Vérifie ta boîte de réception (et les spams).", "info");
    } catch (e) { console.error(e); afficherMessage(texteErreurAuth(e)); }
  });

  $("btn-deconnexion").addEventListener("click", () => signOut(auth));
  $("btn-deco-profil").addEventListener("click", () => signOut(auth));

  $("publier").addEventListener("click", async () => {
    if (!user || !profil){ afficherMessage("Connecte-toi et complète ton profil pour publier."); return; }
    const titre = $("titre").value.trim();
    const ville = $("ville").value;
    const prix = Number($("prix").value);
    const desc = $("desc").value.trim();

    if (!titre || !prix || prix < 0){
      alert("Remplis au moins le titre et le prix.");
      return;
    }

    const btn = $("publier");
    btn.disabled = true; btn.textContent = "Publication…";
    try {
      await addDoc(missionsRef, {
        titre, ville, prix, desc,
        tel: profil.tel,
        auteur: profil.prenom + " " + profil.nom.charAt(0).toUpperCase() + ".",
        uid: user.uid,
        createdAt: serverTimestamp()
      });
      ["titre","prix","desc"].forEach(id => $(id).value = "");
      afficherMessage("");
    } catch (e) {
      console.error(e);
      afficherMessage("La mission n'a pas pu être publiée. Réessaie.");
    }
    btn.disabled = false; btn.textContent = "Publier";
  });

  $("filtre").addEventListener("change", afficher);
</script>
</body>
 </html>
